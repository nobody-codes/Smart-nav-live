<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Navigation Pin / Compass Icon -->
  <g transform="translate(10, 8)">
    <circle cx="22" cy="22" r="21" fill="url(#navGrad)" filter="url(#glow)"/>
    <circle cx="22" cy="22" r="17" fill="#0f172a"/>
    <!-- Compass Pointer -->
    <polygon points="22,7 28,22 22,18" fill="#10b981"/>
    <polygon points="22,7 16,22 22,18" fill="#06b6d4"/>
    <polygon points="22,37 28,22 22,26" fill="#64748b"/>
    <polygon points="22,37 16,22 22,26" fill="#94a3b8"/>
    <circle cx="22" cy="22" r="3.5" fill="#ffffff"/>
  </g>
  <!-- Text Brand -->
  <text x="64" y="31" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Smart<tspan fill="#10b981">Nav</tspan>
  </text>
  <text x="65" y="46" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
    INTELLIGENT TRAFFIC
  </text>
</svg>
