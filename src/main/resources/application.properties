# ========================================================
# Real-Time Crowdsourced Mapping & Intelligent Navigation
# Application Configuration
# ========================================================

spring.application.name=smart-nav-system
server.port=${PORT:8080}

# Profile Configuration (default to 'dev' which runs seamlessly out-of-the-box)
# To run with MySQL, set spring.profiles.active=mysql
spring.profiles.active=dev

# File upload settings (photos for traffic incident reports)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
smartnav.upload.dir=uploads/reports/

# Thymeleaf Template Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# JPA / Hibernate Common Settings
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# App specific properties
smartnav.app.name=SmartNav Live
smartnav.traffic.auto-approve=false
smartnav.traffic.congestion-penalty-factor=1.8
smartnav.traffic.default-alert-radius-km=5.0
