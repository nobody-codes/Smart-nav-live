<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: common-head('My Submissions & Hazards')}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <h2 class="fw-bold text-white mb-1">My Submitted Incident Reports</h2>
                <p class="text-secondary small mb-0">Track verification status, moderation feedback, and contribution points.</p>
            </div>
            <a th:href="@{/report}" class="btn btn-primary-smartnav">
                <i class="fa-solid fa-plus-circle me-1"></i> Report New Incident
            </a>
        </div>

        <div class="card-smartnav p-0 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0 align-middle">
                    <thead class="bg-surface text-secondary small text-uppercase">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Category</th>
                            <th>Address</th>
                            <th>Severity</th>
                            <th>Status</th>
                            <th>Date Reported</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(reports)}">
                            <td colspan="7" class="text-center py-5 text-secondary">
                                <i class="fa-solid fa-folder-open fs-2 mb-2"></i>
                                <div>No reports submitted yet. Help drivers by reporting road hazards!</div>
                            </td>
                        </tr>
                        <tr th:each="r : ${reports}">
                            <td class="ps-4 fw-bold text-secondary" th:text="'#' + ${r.id}">#1</td>
                            <td>
                                <span class="fw-bold text-white d-flex align-items-center gap-2">
                                    <span th:text="${r.category}">ACCIDENT</span>
                                </span>
                            </td>
                            <td>
                                <div class="text-light small text-truncate" style="max-width: 250px;" th:text="${r.address}">Address</div>
                            </td>
                            <td>
                                <span class="badge bg-secondary-subtle text-light" th:text="${r.severity}">MEDIUM</span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${r.status == 'APPROVED' ? 'badge-status-approved' : (r.status == 'PENDING' ? 'badge-status-pending' : 'badge-status-rejected')}" th:text="${r.status}">APPROVED</span>
                            </td>
                            <td class="text-secondary small" th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}">
                                2026-09-27
                            </td>
                            <td class="text-end pe-4">
                                <button class="btn btn-sm btn-outline-danger btn-delete-personal-report" th:data-id="${r.id}" title="Delete Report">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/footer :: scripts}"></div>

    <script>
        document.querySelectorAll('.btn-delete-personal-report').forEach(btn => {
            btn.addEventListener('click', e => {
                if (!confirm('Are you sure you want to delete this incident report?')) return;
                const id = e.currentTarget.dataset.id;
                fetch(`/api/reports/${id}`, { method: 'DELETE' })
                    .then(r => r.json())
                    .then(res => {
                        if (res.success) {
                            SmartNav.showToast({ title: 'Deleted', message: 'Report removed.', type: 'info' });
                            setTimeout(() => location.reload(), 800);
                        } else {
                            alert(res.message);
                        }
                    });
            });
        });
    </script>
</body>
</html>
