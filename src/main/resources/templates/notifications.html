<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: common-head('Traffic Notifications Center')}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold text-white mb-1">Notifications Center</h2>
                        <p class="text-secondary small mb-0">Live incident broadcasts, moderation outcomes, and badge achievements</p>
                    </div>
                    <button id="btnMarkAllRead" class="btn btn-secondary-smartnav btn-sm">
                        <i class="fa-solid fa-check-double me-1"></i> Mark All as Read
                    </button>
                </div>

                <div class="card-smartnav p-3">
                    <div id="notificationsList" class="d-flex flex-column gap-2">
                        <!-- Populated via fetch & real-time WebSockets -->
                        <div class="text-center py-5 text-secondary" id="notifLoading">
                            <i class="fa-solid fa-spinner fa-spin fs-3 mb-2"></i>
                            <div>Loading notifications...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/footer :: scripts}"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadNotifications();

            document.getElementById('btnMarkAllRead').addEventListener('click', () => {
                fetch('/api/notifications/read-all', { method: 'PUT' })
                    .then(() => {
                        loadNotifications();
                        SmartNav.updateNotificationBadge(0);
                    });
            });

            // WebSocket live notifications hook
            if (window.SmartNav) {
                SmartNav.listeners.onNotification.push(() => loadNotifications());
            }
        });

        function loadNotifications() {
            fetch('/api/notifications')
                .then(r => r.json())
                .then(res => {
                    const container = document.getElementById('notificationsList');
                    if (!res.success || !res.data || res.data.length === 0) {
                        container.innerHTML = `
                            <div class="text-center py-5 text-secondary">
                                <i class="fa-regular fa-bell-slash fs-2 mb-2"></i>
                                <div>No notifications at this time. All caught up!</div>
                            </div>
                        `;
                        return;
                    }

                    container.innerHTML = '';
                    res.data.forEach(item => {
                        const iconMap = {
                            INCIDENT_ALERT: 'fa-triangle-exclamation text-danger',
                            REPORT_STATUS: 'fa-circle-check text-success',
                            BADGE_EARNED: 'fa-medal text-warning',
                            SYSTEM: 'fa-bullhorn text-info'
                        };
                        const icon = iconMap[item.type] || 'fa-bell text-secondary';
                        const unreadClass = !item.isRead ? 'border-primary' : 'border-secondary-subtle';
                        const unreadBg = !item.isRead ? 'background: rgba(16,185,129,0.06);' : '';

                        const el = document.createElement('div');
                        el.className = `p-3 rounded bg-surface border ${unreadClass} d-flex justify-content-between align-items-start gap-3`;
                        el.style = unreadBg;
                        el.innerHTML = `
                            <div class="d-flex align-items-start gap-3">
                                <div class="stat-icon-wrapper rounded-circle p-2 mt-1" style="width: 38px; height: 38px; background: rgba(255,255,255,0.05);">
                                    <i class="fa-solid ${icon}"></i>
                                </div>
                                <div>
                                    <div class="fw-bold text-white small d-flex align-items-center gap-2">
                                        <span>${item.title}</span>
                                        ${!item.isRead ? '<span class="badge bg-primary" style="font-size: 0.65rem;">NEW</span>' : ''}
                                    </div>
                                    <div class="text-light small mt-1">${item.message}</div>
                                    <div class="text-secondary small mt-1" style="font-size: 0.75rem;">
                                        ${new Date(item.createdAt).toLocaleString()}
                                    </div>
                                </div>
                            </div>
                            ${!item.isRead ? `
                                <button class="btn btn-sm btn-outline-secondary py-0 px-2" style="font-size: 0.75rem;" onclick="markSingleRead(${item.id})">
                                    Mark read
                                </button>
                            ` : ''}
                        `;
                        container.appendChild(el);
                    });
                });
        }

        function markSingleRead(id) {
            fetch(`/api/notifications/${id}/read`, { method: 'PUT' })
                .then(() => loadNotifications());
        }
    </script>
</body>
</html>
