<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: common-head('Page Not Found (404)')}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-auto py-5 text-center">
        <div class="card-smartnav p-5 mx-auto" style="max-width: 580px;">
            <div class="display-1 fw-bold text-primary mb-2">404</div>
            <div class="stat-icon-wrapper rounded-circle mx-auto mb-3 bg-primary-light text-primary" style="width: 72px; height: 72px;">
                <i class="fa-solid fa-map-location-dot fs-2"></i>
            </div>
            <h3 class="fw-bold text-white mb-2" th:text="${errorTitle != null ? errorTitle : 'Road Not Found'}">Route Not Found</h3>
            <p class="text-secondary mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested navigation route, waypoint, or page could not be located in our telemetry database.'}">
                The requested URL or navigation node is not mapped.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a th:href="@{/}" class="btn btn-secondary-smartnav">
                    <i class="fa-solid fa-house me-1"></i> Return Home
                </a>
                <a th:href="@{/map}" class="btn btn-primary-smartnav">
                    <i class="fa-solid fa-map me-1"></i> Open Live Map
                </a>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
