<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: common-head('Set New Password | SmartNav')}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card-smartnav p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="stat-icon-wrapper rounded-circle mx-auto mb-3 text-primary" style="width: 64px; height: 64px; background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.3);">
                            <i class="fa-solid fa-lock-open fs-2"></i>
                        </div>
                        <h3 class="fw-bold text-white mb-1">Set New Password</h3>
                        <p class="text-secondary small">Choose a secure, strong password to protect your driver account.</p>
                    </div>

                    <!-- Invalid/Expired Token State -->
                    <div th:if="${!tokenValid}" class="text-center py-3">
                        <div class="alert alert-danger py-2 px-3 small mb-3">
                            <i class="fa-solid fa-triangle-exclamation me-1"></i>
                            <span th:text="${errorMessage != null ? errorMessage : 'Password reset link is invalid or has expired. Please request a new link.'}">Invalid or expired token.</span>
                        </div>
                        <a th:href="@{/forgot-password}" class="btn btn-primary-smartnav w-100 py-2">
                            <i class="fa-solid fa-rotate-right me-2"></i> Request New Reset Link
                        </a>
                    </div>

                    <!-- Valid Token Form State -->
                    <div th:if="${tokenValid}">
                        <div id="resetAlert" class="alert alert-danger d-none py-2 px-3 small mb-3"></div>

                        <form id="resetPasswordForm">
                            <input type="hidden" id="resetToken" th:value="${token}">

                            <div class="mb-3">
                                <label class="form-label text-secondary small fw-bold" for="newPassword">New Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-surface border-secondary-subtle text-secondary"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="newPassword" class="form-control form-control-smartnav" required minlength="8" placeholder="••••••••" autocomplete="new-password">
                                    <button type="button" class="btn btn-secondary-smartnav px-2" id="toggleNewPassBtn" title="Show/Hide">
                                        <i class="fa-regular fa-eye" id="toggleNewPassIcon"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-secondary small fw-bold" for="confirmNewPassword">Confirm New Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-surface border-secondary-subtle text-secondary"><i class="fa-solid fa-check-double"></i></span>
                                    <input type="password" id="confirmNewPassword" class="form-control form-control-smartnav" required minlength="8" placeholder="••••••••" autocomplete="new-password">
                                    <button type="button" class="btn btn-secondary-smartnav px-2" id="toggleConfirmPassBtn" title="Show/Hide">
                                        <i class="fa-regular fa-eye" id="toggleConfirmPassIcon"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Password Strength Checklist -->
                            <div class="mb-4">
                                <div class="p-3 rounded bg-surface border border-secondary-subtle small text-secondary">
                                    <div class="fw-bold mb-2 text-white" style="font-size: 0.78rem;">Requirements:</div>
                                    <div class="d-flex flex-wrap gap-2" style="font-size: 0.74rem;">
                                        <span id="resetReqLength" class="badge bg-dark border border-secondary text-secondary"><i class="fa-solid fa-circle-xmark me-1 text-danger"></i> 8+ Characters</span>
                                        <span id="resetReqUpper" class="badge bg-dark border border-secondary text-secondary"><i class="fa-solid fa-circle-xmark me-1 text-danger"></i> Uppercase</span>
                                        <span id="resetReqLower" class="badge bg-dark border border-secondary text-secondary"><i class="fa-solid fa-circle-xmark me-1 text-danger"></i> Lowercase</span>
                                        <span id="resetReqNumber" class="badge bg-dark border border-secondary text-secondary"><i class="fa-solid fa-circle-xmark me-1 text-danger"></i> Number (0-9)</span>
                                        <span id="resetReqSpecial" class="badge bg-dark border border-secondary text-secondary"><i class="fa-solid fa-circle-xmark me-1 text-danger"></i> Special Character</span>
                                    </div>
                                    <div id="resetMatchStatus" class="mt-2 small fw-bold text-danger d-none">
                                        <i class="fa-solid fa-triangle-exclamation me-1"></i> Passwords do not match.
                                    </div>
                                </div>
                            </div>

                            <button type="submit" id="btnResetSubmit" class="btn btn-primary-smartnav w-100 py-2 mb-3 fw-bold">
                                <i class="fa-solid fa-floppy-disk me-2"></i> Update Password
                            </button>
                        </form>
                    </div>

                    <div class="text-center text-secondary small pt-2 border-top border-secondary-subtle">
                        <a th:href="@{/login}" class="text-primary fw-semibold text-decoration-none">
                            <i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/footer :: scripts}"></div>

    <script th:if="${tokenValid}">
        function setupToggle(btnId, inputId, iconId) {
            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (btn && input) {
                btn.addEventListener('click', () => {
                    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                    input.setAttribute('type', type);
                    icon.className = type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash text-primary';
                });
            }
        }
        setupToggle('toggleNewPassBtn', 'newPassword', 'toggleNewPassIcon');
        setupToggle('toggleConfirmPassBtn', 'confirmNewPassword', 'toggleConfirmPassIcon');

        const newPassInput = document.getElementById('newPassword');
        const confirmPassInput = document.getElementById('confirmNewPassword');
        const matchStatus = document.getElementById('resetMatchStatus');

        function updateChecklistItem(id, isValid) {
            const el = document.getElementById(id);
            if (!el) return;
            if (isValid) {
                el.className = 'badge bg-success-subtle border border-success text-success';
                el.querySelector('i').className = 'fa-solid fa-circle-check me-1 text-success';
            } else {
                el.className = 'badge bg-dark border border-secondary text-secondary';
                el.querySelector('i').className = 'fa-solid fa-circle-xmark me-1 text-danger';
            }
        }

        function evaluateResetPassword() {
            const val = newPassInput.value;
            const hasLen = val.length >= 8;
            const hasUp = /[A-Z]/.test(val);
            const hasLow = /[a-z]/.test(val);
            const hasNum = /[0-9]/.test(val);
            const hasSpec = /[^A-Za-z0-9]/.test(val);

            updateChecklistItem('resetReqLength', hasLen);
            updateChecklistItem('resetReqUpper', hasUp);
            updateChecklistItem('resetReqLower', hasLow);
            updateChecklistItem('resetReqNumber', hasNum);
            updateChecklistItem('resetReqSpecial', hasSpec);

            if (confirmPassInput.value.length > 0) {
                if (val !== confirmPassInput.value) {
                    matchStatus.classList.remove('d-none');
                } else {
                    matchStatus.classList.add('d-none');
                }
            } else {
                matchStatus.classList.add('d-none');
            }

            return hasLen && hasUp && hasLow && hasNum && hasSpec;
        }

        newPassInput.addEventListener('input', evaluateResetPassword);
        confirmPassInput.addEventListener('input', evaluateResetPassword);

        document.getElementById('resetPasswordForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const alertBox = document.getElementById('resetAlert');
            const submitBtn = document.getElementById('btnResetSubmit');
            const token = document.getElementById('resetToken').value;

            alertBox.classList.add('d-none');
            alertBox.textContent = '';

            const newPass = newPassInput.value;
            const confirmPass = confirmPassInput.value;

            if (newPass.length < 8) {
                alertBox.textContent = 'Password must contain at least 8 characters.';
                alertBox.classList.remove('d-none');
                return;
            }

            if (!evaluateResetPassword()) {
                alertBox.textContent = 'Password must contain at least one uppercase letter, one lowercase letter, one number, and one special character.';
                alertBox.classList.remove('d-none');
                return;
            }

            if (newPass !== confirmPass) {
                alertBox.textContent = 'Passwords do not match.';
                alertBox.classList.remove('d-none');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Updating Password...';

            fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    token: token,
                    newPassword: newPass,
                    confirmPassword: confirmPass
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/login?resetSuccess=true';
                } else {
                    alertBox.textContent = data.message || 'Failed to reset password.';
                    alertBox.classList.remove('d-none');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk me-2"></i> Update Password';
                }
            })
            .catch(() => {
                alertBox.textContent = 'A network error occurred. Please try again.';
                alertBox.classList.remove('d-none');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk me-2"></i> Update Password';
            });
        });
    </script>
</body>
</html>
